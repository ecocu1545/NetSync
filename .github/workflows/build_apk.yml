name: NetSync APK Derleyici (CI/CD)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Paketleri İndir
        run: flutter pub get

      - name: Uygulama Simgelerini Oluştur
        run: dart run flutter_launcher_icons || true

      - name: Release APK Derle
        run: flutter build apk --release --no-tree-shake-icons

      - name: APK Dosyasını İndirilebilir Çıktı (Artifact) Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: netsync-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
